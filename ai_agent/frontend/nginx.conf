# ==============================================================================
# DataPulse AI — Frontend Nginx Configuration & Reverse Proxy
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text, stylesheet, and script assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Static assets serving with SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Static asset caching for CSS, JS, SVG, and ICO assets
    location ~* \.(?:css|js|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # API Reverse Proxy to FastAPI Backend Service (backend:8001)
    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Prevent browser and intermediate proxy caching of dynamic API responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # Timeouts aligned with BigQuery query caps
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Redirect /api without trailing slash to /api/
    location = /api {
        return 302 /api/;
    }
}
