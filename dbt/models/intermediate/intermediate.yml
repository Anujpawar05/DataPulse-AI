version: 2

models:
  - name: int_order_details
    columns:
      - name: sale_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null

  - name: int_product_sales
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: int_customer_orders
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: int_payment_summary
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

  - name: int_inventory_status
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: int_daily_sales
    columns:
      - name: sales_date
        data_tests:
          - not_null
          - unique

  - name: int_category_sales
    columns:
      - name: product_category
        data_tests:
          - not_null
          - unique